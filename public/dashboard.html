<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body class="dash">
  <header class="topbar">
    <h1>🏘️ Agent Town <span id="conn" class="dot" title="connecting"></span></h1>
    <nav class="tabs"><a href="/">Town</a><a href="/dashboard" class="on">Dashboard</a></nav>
    <span id="mode" class="badge" hidden>DEMO</span>
    <span class="refresh">
      <span id="updated" class="muted"></span>
      <label class="muted" title="How often to re-fetch Azure DevOps">Every <select id="refreshEvery"></select></label>
      <button id="refreshNow" class="btn" title="Re-fetch Azure DevOps and git status now">↻ Refresh</button>
    </span>
    <button id="alerts" class="alerts" title="Desktop notification when a session starts waiting for you or a review is requested">🔕 Alerts off</button>
  </header>

  <main class="grid">
    <section id="stats" class="kpis wide"></section>

    <section class="card wide" id="sprintCard" hidden>
      <div class="card-head"><h2 id="sprintTitle">My sprint</h2><a id="boardLink" target="_blank" rel="noopener" class="muted">Open board ↗</a></div>
      <div id="sprint"></div>
    </section>

    <section class="card wide attention-card">
      <div class="card-head"><h2>Needs your attention <span id="attentionCount" class="count"></span></h2><button id="showSnoozed" class="linkish" hidden></button></div>
      <div id="attention"></div>
    </section>

    <div class="split wide">
      <section class="card" id="runRateCard" hidden>
        <div class="card-head"><h2 id="runRateTitle">Run rate</h2><span class="muted">team, working days</span></div>
        <div id="runRate"></div>
      </section>
      <section class="card" id="prsCard" hidden>
        <div class="card-head"><h2>Pull requests</h2></div>
        <div class="pr-cols">
          <div><h3>Mine <span id="prsMineCount" class="count"></span></h3><ul id="prs" class="prs"></ul></div>
          <div><h3>To review <span id="reviewsCount" class="count"></span></h3><ul id="reviews" class="prs"></ul></div>
        </div>
      </section>
    </div>

    <section class="card wide" id="teamCard" hidden>
      <div class="card-head"><h2 id="teamTitle">Team delivery</h2><a id="teamBoardLink" target="_blank" rel="noopener" class="muted">Open board ↗</a></div>
      <div id="team"></div>
    </section>
  </main>
  <script src="/dashboard.js" type="module"></script>
</body>
</html>
